name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm turbo run build lint test --concurrency=2

      - run: pnpm test:packages

  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./packages/action
        with:
          # movesafe itself has no root tsconfig.json (each package has its
          # own) — point at a package that does.
          path: packages/core

      - id: broken-imports
        continue-on-error: true
        uses: ./packages/action
        with:
          path: packages/core/test/fixtures/graph-repos/unresolved-only

      - name: Verify Action exit code and report
        env:
          BROKEN_OUTCOME: ${{ steps.broken-imports.outcome }}
          BROKEN_REPORT: ${{ steps.broken-imports.outputs.report_path }}
          SUMMARY_PUBLISHED: ${{ steps.broken-imports.outputs.summary_published }}
        run: |
          test "$BROKEN_OUTCOME" = failure
          test "$SUMMARY_PUBLISHED" = true
          test -s "$BROKEN_REPORT"
          grep -q does-not-exist "$BROKEN_REPORT"
