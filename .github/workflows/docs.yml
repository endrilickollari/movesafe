name: Docs

on:
  pull_request:
    paths:
      - "packages/docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/configure-pages@v6

      - uses: actions/cache@v6
        with:
          path: packages/docs/.vitepress/cache
          key: vitepress-${{ runner.os }}-${{ hashFiles('packages/docs/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            vitepress-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @movesafe/docs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/docs/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
