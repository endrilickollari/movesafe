name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/configure-pages@v4

      - uses: actions/cache@v4
        with:
          path: packages/docs/.vitepress/cache
          key: vitepress-${{ runner.os }}-${{ hashFiles('packages/docs/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            vitepress-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @movesafe/docs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
