name: Real-repository benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: benchmark-baseline
          key: benchmark-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            benchmark-${{ runner.os }}-${{ github.ref_name }}-

      - run: pnpm --filter @movesafe/benchmark bench -- --output ../../benchmark-results.json --baseline ../../benchmark-baseline/benchmark-results.json --max-regression 0.25

      - name: Store successful run as the next baseline
        run: |
          mkdir -p benchmark-baseline
          cp benchmark-results.json benchmark-baseline/benchmark-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movesafe-benchmark-results
          path: benchmark-results.json
          if-no-files-found: error
