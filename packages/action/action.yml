name: 'movesafe check'
description: 'Fails the build when movesafe finds broken imports, orphaned barrel exports, or case-sensitivity mismatches.'
inputs:
  path:
    description: 'Directory to check, relative to the consuming repo checkout.'
    required: false
    default: '.'
  publish_summary:
    description: 'Whether to append the Markdown report to the workflow summary.'
    required: false
    default: 'true'
outputs:
  report_path:
    description: 'Absolute path to the generated Markdown report.'
    value: ${{ steps.check.outputs.report_path }}
  summary_published:
    description: 'Whether the report was appended to the workflow summary.'
    value: ${{ steps.check.outputs.summary_published }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24

    - id: check
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        MOVESAFE_CHECK_PATH: ${{ inputs.path }}
        MOVESAFE_PUBLISH_SUMMARY: ${{ inputs.publish_summary }}
      run: |
        set +e
        report_path="$RUNNER_TEMP/movesafe-check.md"
        npx --yes movesafe@0.1.0 check "$MOVESAFE_CHECK_PATH" --md > "$report_path"
        exit_code=$?
        summary_published=false
        if [ "$MOVESAFE_PUBLISH_SUMMARY" = true ]; then
          cat "$report_path" >> "$GITHUB_STEP_SUMMARY"
          summary_published=true
        fi
        echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
        echo "report_path=$report_path" >> "$GITHUB_OUTPUT"
        echo "summary_published=$summary_published" >> "$GITHUB_OUTPUT"

    - shell: bash
      env:
        MOVESAFE_EXIT_CODE: ${{ steps.check.outputs.exit_code }}
      run: exit "$MOVESAFE_EXIT_CODE"
