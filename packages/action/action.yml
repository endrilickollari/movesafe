name: 'movesafe check'
description: 'Fails the build when movesafe finds broken imports, orphaned barrel exports, or case-sensitivity mismatches.'
inputs:
  path:
    description: 'Directory to check, relative to the consuming repo checkout.'
    required: false
    default: '.'
outputs:
  report_path:
    description: 'Absolute path to the generated Markdown report.'
    value: ${{ steps.check.outputs.report_path }}
  summary_published:
    description: 'Whether the report was appended to the workflow summary.'
    value: ${{ steps.check.outputs.summary_published }}
runs:
  using: composite
  steps:
    - name: Resolve movesafe checkout root
      shell: bash
      run: echo "MOVESAFE_ROOT=$(cd "${{ github.action_path }}/../.." && pwd)" >> "$GITHUB_ENV"

    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: ${{ env.MOVESAFE_ROOT }}/pnpm-lock.yaml

    - shell: bash
      working-directory: ${{ env.MOVESAFE_ROOT }}
      run: pnpm install --frozen-lockfile

    - shell: bash
      working-directory: ${{ env.MOVESAFE_ROOT }}
      run: pnpm turbo run build --filter=movesafe

    - id: check
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        MOVESAFE_CHECK_PATH: ${{ inputs.path }}
      run: |
        set +e
        report_path="$RUNNER_TEMP/movesafe-check.md"
        node "$MOVESAFE_ROOT/packages/cli/dist/index.js" check "$MOVESAFE_CHECK_PATH" --md > "$report_path"
        exit_code=$?
        cat "$report_path" >> "$GITHUB_STEP_SUMMARY"
        echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
        echo "report_path=$report_path" >> "$GITHUB_OUTPUT"
        echo "summary_published=true" >> "$GITHUB_OUTPUT"

    - shell: bash
      env:
        MOVESAFE_EXIT_CODE: ${{ steps.check.outputs.exit_code }}
      run: exit "$MOVESAFE_EXIT_CODE"
